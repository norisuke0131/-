<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>魔界騎士</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen arcade cabinet — header strip, pixel canvas, touch pad below (touch devices only). Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0c0a12;
  --cabinet:#16121e;
  --edge:#2a2236;
  --fg:#ece4d0;
  --dim:#8d839c;
  --blood:#c8312b;
  --gold:#e3b04b;
  --font-ui:'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',monospace;
  --font-pixel:'Press Start 2P','DotGothic16',monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;padding-inline:16px;padding-block:8px}
.bar{width:100%;max-width:768px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:18px;letter-spacing:.12em;color:var(--blood);text-shadow:0 0 8px rgba(200,49,43,.45)}
.logo small{display:inline-block;margin-left:8px;font-family:var(--font-pixel);font-size:8px;color:var(--dim);letter-spacing:.08em;vertical-align:middle}
.tools{display:flex;gap:8px}
.tools button{font-family:var(--font-ui);font-size:13px;color:var(--fg);background:var(--cabinet);border:1px solid var(--edge);border-radius:4px;padding:4px 10px;cursor:pointer}
.tools button:focus-visible,.pad button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{position:relative;flex:0 0 auto;border:2px solid var(--edge);background:#000;box-shadow:0 0 0 6px var(--cabinet),0 10px 40px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.help{max-width:768px;width:100%;font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
.help kbd{font-family:var(--font-pixel);font-size:8px;color:var(--fg);background:var(--cabinet);border:1px solid var(--edge);border-radius:3px;padding:2px 4px}
.stage{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.side{display:none;flex:1 1 0;min-width:0;align-items:center;justify-content:center}
.pad{width:100%;max-width:520px;display:none;flex-direction:column;gap:6px;touch-action:none}
.padrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tip{font-size:12px;color:var(--dim);text-align:center;line-height:1.5}
.tip b{color:var(--gold);font-weight:normal}
body.touch{touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
body.touch .pad{display:flex}
body.touch .help{display:none}
body.land .bar,body.land .pad{display:none!important}
body.land .side{display:flex}
body.land .wrap{padding-block:4px;justify-content:center}
.dpad{position:relative;width:var(--dp,150px);height:var(--dp,150px);flex:0 0 auto;border-radius:50%;background:var(--cabinet);border:2px solid var(--edge);touch-action:none}
.dpad::before,.dpad::after{content:"";position:absolute;background:var(--edge);border-radius:8px}
.dpad::before{left:33%;top:8%;width:34%;height:84%}
.dpad::after{top:33%;left:8%;height:34%;width:84%}
.dpad span{position:absolute;z-index:1;color:var(--dim);font-size:16px;line-height:1;transform:translate(-50%,-50%)}
.dpad .u{left:50%;top:20%}.dpad .d{left:50%;top:80%}.dpad .l{left:20%;top:50%}.dpad .r{left:80%;top:50%}
.dpad.on-u .u,.dpad.on-d .d,.dpad.on-l .l,.dpad.on-r .r{color:var(--gold)}
.btns{display:flex;gap:14px;align-items:flex-end;flex:0 0 auto}
.btnsCol{display:flex;flex-direction:column;align-items:center;gap:12px}
.pad button,.side button{width:var(--bt,80px);height:var(--bt,80px);border-radius:50%;border:2px solid var(--edge);font-family:var(--font-ui);font-size:15px;color:var(--fg);touch-action:none;-webkit-user-select:none;user-select:none}
.atk{background:#3a1416;margin-bottom:26px}
.jmp{background:#2b2238}
button.on{filter:brightness(1.7);transform:scale(.95)}
button.start{width:auto!important;height:auto!important;border-radius:4px!important;font-size:12px!important;padding:6px 12px;background:var(--cabinet)}
</style>

<div class="wrap" id="wrap">
  <div class="bar" id="bar">
    <div class="logo">魔界騎士<small>MAKAI KNIGHT</small></div>
    <div class="tools">
      <button id="btnPause" type="button">一時停止</button>
      <button id="btnMute" type="button">音：ON</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="side" id="sideL"></div>
    <div class="screen" id="screen"><canvas id="cv" width="256" height="224" aria-label="ゲーム画面"></canvas></div>
    <div class="side" id="sideR"></div>
  </div>
  <p class="help" id="help">
    移動 <kbd>←</kbd><kbd>→</kbd>　はしご <kbd>↑</kbd><kbd>↓</kbd>　しゃがむ <kbd>↓</kbd>　ジャンプ <kbd>X</kbd>/<kbd>SPACE</kbd>　攻撃 <kbd>Z</kbd>　スタート/ポーズ <kbd>ENTER</kbd>　音 <kbd>M</kbd><br>
    鎧は1発で砕け、パンツ一丁でもう1発受けると骨になる。ジャンプ中は向きを変えられない。
  </p>
  <div class="pad" id="pad">
    <div class="padrow">
      <div id="slotL"><div class="dpad" id="dpad"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div></div>
      <div id="slotR"><div class="btnsCol" id="btnGroup">
        <div class="btns">
          <button class="atk" id="tAtk" type="button">攻撃</button>
          <button class="jmp" id="tJmp" type="button">ジャンプ</button>
        </div>
        <button class="start" id="tStart" type="button">START / ポーズ</button>
      </div></div>
    </div>
    <p class="tip" id="tip">十字キーを<b>◀ か ▶ に倒したままジャンプ</b>で斜めジャンプ。<br>横向きにすると画面が大きくなります。</p>
  </div>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=256,H=224,TS=16,LW=210,LH=14;
const GROUND_Y=12;

/* ---------- layout ---------- */
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
function layout(){
  const touch=document.body.classList.contains('touch');
  const vw=window.innerWidth,vh=window.innerHeight;
  const land=touch&&vw>vh;
  document.body.classList.toggle('land',land);
  const dpadEl=document.getElementById('dpad'),grp=document.getElementById('btnGroup');
  const s=document.getElementById('screen');
  let w;
  if(land){
    document.getElementById('sideL').appendChild(dpadEl);
    document.getElementById('sideR').appendChild(grp);
    const h=vh-16;
    w=Math.min(h*W/H,vw-2*170);
    const side=(vw-w)/2-20;
    const dp=Math.max(110,Math.min(170,side-8));
    document.documentElement.style.setProperty('--dp',dp+'px');
    document.documentElement.style.setProperty('--bt',Math.max(58,Math.min(78,(side-24)/2))+'px');
  }else{
    document.getElementById('slotL').appendChild(dpadEl);
    document.getElementById('slotR').appendChild(grp);
    document.documentElement.style.setProperty('--dp',Math.min(160,Math.max(120,vw*0.38))+'px');
    document.documentElement.style.setProperty('--bt',Math.min(84,Math.max(64,vw*0.2))+'px');
    const wrap=document.getElementById('wrap');
    const bar=document.getElementById('bar');
    const other=touch?document.getElementById('pad'):document.getElementById('help');
    const availW=wrap.clientWidth-32-16;
    const availH=wrap.clientHeight-bar.offsetHeight-other.offsetHeight-16-24-16;
    w=Math.min(availW,availH*W/H,768);
  }
  w=Math.max(160,w);
  s.style.width=Math.floor(w)+'px';
  s.style.height=Math.floor(w*H/W)+'px';
}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,200));
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- audio ---------- */
let AC=null,master=null,musicGain=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=0.22;musicGain.connect(master);
  }catch(e){AC=null;}
}
function tone(f,dur,type='square',vol=0.12,slide=0,when=0,dest=null){
  if(!AC||muted)return;
  const t=AC.currentTime+when;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.02);
}
let noiseBuf=null;
function noise(dur,vol=0.15,when=0){
  if(!AC||muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=AC.currentTime+when;
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const SFX={
  jump(){tone(220,0.12,'square',0.08,220);},
  throw(){tone(880,0.06,'square',0.06,-400);},
  hit(){tone(160,0.06,'square',0.1,-60);},
  kill(){noise(0.18,0.14);tone(300,0.15,'square',0.07,-250);},
  armor(){noise(0.3,0.2);tone(500,0.3,'sawtooth',0.1,-420);},
  die(){[392,349,311,262,196].forEach((f,i)=>tone(f,0.22,'square',0.1,0,i*0.16));},
  item(){[660,880,1320].forEach((f,i)=>tone(f,0.08,'square',0.08,0,i*0.06));},
  rise(){tone(90,0.4,'triangle',0.15,60);},
  caw(){tone(1200,0.1,'sawtooth',0.05,-700);},
  shoot(){tone(420,0.1,'triangle',0.08,-200);},
  boom(){noise(0.5,0.25);tone(80,0.5,'triangle',0.2,-40);},
  pot(){noise(0.08,0.12);tone(700,0.05,'square',0.05);},
  clear(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.09,0,i*0.14));},
  start(){[262,330,392,523].forEach((f,i)=>tone(f,0.12,'square',0.08,0,i*0.09));},
  pause(){tone(988,0.06,'square',0.07);tone(1319,0.08,'square',0.07,0,0.07);},
};
/* original BGM in D minor */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MEL=[62,0,65,0,69,0,67,65, 64,0,62,0,61,0,57,0, 62,0,65,0,69,0,72,70, 69,0,67,0,65,0,64,0,
           70,0,69,0,67,0,65,0, 64,0,65,0,67,0,69,0, 70,69,67,65,64,62,61,64, 62,0,0,0,57,0,0,0];
const ROOTS=[50,45,50,48,46,48,45,50];
const BOSS_MEL=[62,62,74,62,72,62,70,69, 62,62,74,62,72,70,69,67, 63,63,75,63,74,63,72,70, 69,0,68,0,67,0,66,0];
const BOSS_ROOTS=[38,38,39,45];
let music=null;
function startMusic(kind){if(!AC)return;music={kind,step:0,next:AC.currentTime+0.05};}
function stopMusic(){music=null;}
function musicTick(){
  if(!AC||!music||muted)return;
  const boss=music.kind==='boss';
  const dt=boss?0.11:0.15;
  while(music.next<AC.currentTime+0.2){
    const when=music.next-AC.currentTime;
    const mel=boss?BOSS_MEL:MEL,roots=boss?BOSS_ROOTS:ROOTS;
    const i=music.step%mel.length;
    if(mel[i])tone(mtof(mel[i]),dt*1.6,'square',0.07,0,when,musicGain);
    const r=roots[Math.floor(i/8)%roots.length];
    const pat=[0,0,12,0,0,0,12,7];
    tone(mtof(r+pat[i%8]),dt*0.9,'triangle',0.16,0,when,musicGain);
    if(i%4===2)noiseHat(when);
    music.step++;music.next+=dt;
  }
}
function noiseHat(when){if(!AC)return;if(!noiseBuf)noise(0.001,0.0001);const t=AC.currentTime+when;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=noiseBuf;g.gain.setValueAtTime(0.04,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);s.connect(g);g.connect(musicGain);s.start(t);s.stop(t+0.05);}

/* ---------- input ---------- */
const kb={},tk={},latch={};
const prev={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyX:'jump',KeyK:'jump',Space:'jump',KeyZ:'attack',KeyJ:'attack',Enter:'start',KeyP:'start'};
addEventListener('keydown',e=>{
  if(e.code==='KeyM'){toggleMute();return;}
  const k=KEYMAP[e.code];if(!k)return;
  e.preventDefault();initAudio();if(!kb[k])latch[k]=true;kb[k]=true;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){kb[k]=false;e.preventDefault();}});
const held=k=>!!(kb[k]||tk[k]);
let inp={};
function readInput(){
  const names=['left','right','up','down','jump','attack','start'];
  for(const n of names){const h=held(n);inp[n]=h||!!latch[n];inp[n+'P']=(h&&!prev[n])||!!latch[n];prev[n]=h||!!latch[n];latch[n]=false;}
}
// touch d-pad
const dpad=document.getElementById('dpad');
let dpadId=null;
function dpadSet(e){
  const r=dpad.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const was=[tk.left,tk.right,tk.up,tk.down].join();
  if(Math.hypot(dx,dy)<r.width*0.12){tk.left=tk.right=tk.up=tk.down=false;}
  else{
    // 8方向：各方向が±67.5°をカバーし、斜めでは2方向が同時に入る
    const a=Math.atan2(dy,dx)*180/Math.PI;
    tk.right=Math.abs(a)<67.5;tk.left=Math.abs(a)>112.5;
    tk.down=a>22.5&&a<157.5;tk.up=a<-22.5&&a>-157.5;
  }
  if(was!==[tk.left,tk.right,tk.up,tk.down].join())buzz(8);
  dpad.className='dpad'+(tk.up?' on-u':'')+(tk.down?' on-d':'')+(tk.left?' on-l':'')+(tk.right?' on-r':'');
}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(_){}}
function dpadClear(){tk.left=tk.right=tk.up=tk.down=false;dpad.className='dpad';dpadId=null;}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();dpadId=e.pointerId;try{dpad.setPointerCapture(e.pointerId);}catch(_){}dpadSet(e);});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadId)dpadSet(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,e=>{if(e.pointerId===dpadId)dpadClear();}));
function bindBtn(id,k){
  const b=document.getElementById(id);
  const on=e=>{e.preventDefault();initAudio();if(!tk[k])latch[k]=true;tk[k]=true;b.classList.add('on');buzz(12);try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{tk[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('tAtk','attack');bindBtn('tJmp','jump');bindBtn('tStart','start');
cv.addEventListener('pointerdown',()=>{initAudio();if(game.state==='title'||game.state==='over')tk.start=true;setTimeout(()=>tk.start=false,80);});
addEventListener('touchstart',()=>{if(!document.body.classList.contains('touch')){document.body.classList.add('touch');layout();}},{passive:true});
document.addEventListener('touchmove',e=>{if(document.body.classList.contains('touch'))e.preventDefault();},{passive:false});

const btnMute=document.getElementById('btnMute');
function toggleMute(){initAudio();muted=!muted;btnMute.textContent=muted?'音：OFF':'音：ON';if(master)master.gain.value=muted?0:0.5;}
btnMute.addEventListener('click',()=>{toggleMute();btnMute.blur();});
document.getElementById('btnPause').addEventListener('click',e=>{initAudio();togglePause();e.currentTarget.blur();});

/* ---------- storage ---------- */
let hiscore=10000;
try{const v=parseInt(localStorage.getItem('makai-hi')||'',10);if(v>0)hiscore=v;}catch(e){}
function saveHi(){try{localStorage.setItem('makai-hi',String(hiscore));}catch(e){}}

/* ---------- level ---------- */
let map;
const T_EMPTY=0,T_GROUND=1,T_STONE=2,T_PLAT=3,T_LADDER=4,T_WATER=5,T_BRICK=6;
function buildLevel(){
  map=[];for(let y=0;y<LH;y++)map.push(new Uint8Array(LW));
  const F=(x1,y1,x2,y2,t)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(x>=0&&x<LW&&y>=0&&y<LH)map[y][x]=t;};
  F(0,12,LW-1,13,T_GROUND);
  // graveyard
  [9,15,22,30,34].forEach(x=>F(x,11,x,11,T_STONE));
  F(40,8,53,11,T_GROUND);F(39,8,39,11,T_LADDER);
  F(45,7,45,7,T_STONE);F(50,7,50,7,T_STONE);
  F(57,9,60,9,T_PLAT);
  // marsh
  F(66,12,98,13,T_WATER);F(75,12,77,13,T_GROUND);F(87,12,89,13,T_GROUND);
  // forest
  [104,112,131,156].forEach(x=>F(x,11,x,11,T_STONE));
  F(118,7,122,11,T_GROUND);F(117,7,117,11,T_LADDER);
  F(126,8,129,8,T_PLAT);F(140,9,143,9,T_PLAT);
  F(148,12,150,13,T_WATER);
  F(162,9,166,9,T_PLAT);
  // castle gate arena
  F(LW-1,0,LW-1,11,T_BRICK);
  F(196,10,197,11,T_BRICK);
}
const SPAWNS=[
  ['crow',15,11],['pot',27,12],['crow',30,11],['crow',45,7],['plant',48,8],['pot',51,7],['pot',58,9],
  ['plant',76,12],['pot',88,12],
  ['pot',100,12,'armor'],['crow',104,11],['crow',112,11],['pot',120,7],['plant',128,8],['demon',142,9],['crow',131,11],
  ['plant',157,11],['pot',164,9],['pot',172,12,'armor'],
];
const MOVERS=[[66,74,10],[78,86,10],[90,98,10]];
const CHECKPOINT=100;
const ZOMBIE_ZONES=[[6,62],[100,175]];
const GHOST_ZONE=[100,170];

function tileAt(px,py){
  const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
  if(tx<0||tx>=LW)return T_BRICK;
  if(ty<0||ty>=LH)return T_EMPTY;
  return map[ty][tx];
}
const isSolidT=t=>t===T_GROUND||t===T_STONE||t===T_BRICK;
const solidAt=(x,y)=>isSolidT(tileAt(x,y));
const isLadder=(x,y)=>tileAt(x,y)===T_LADDER;

/* ---------- game state ---------- */
const game={state:'title',t:0,loop:0,score:0,lives:3,time:180,timeF:0,camX:0,camMin:0,camLock:false,shake:0,flash:0,checkpoint:0,bossSpawned:false,clearT:0,bonus:0,pauseFrom:null};
let P,ents,shots,ebullets,parts,pops,movers,items,nextId=1;
let zombieTimer=0,ghostTimer=0,lightning=0;

function newPlayer(tx){
  return {x:tx*TS+3,y:GROUND_Y*TS-22,w:10,h:22,vx:0,vy:0,airVx:0,dir:1,onGround:true,armor:true,state:'normal',
    inv:0,throwT:0,weapon:'lance',crouch:false,anim:0,t:0,ride:null,jumpT:99};
}
function resetStage(fromCheckpoint){
  buildLevel();
  const cp=fromCheckpoint?game.checkpoint:0;
  const keepWeapon=P&&fromCheckpoint?P.weapon:'lance';
  P=newPlayer(cp?cp:4);P.weapon=keepWeapon;
  ents=[];shots=[];ebullets=[];parts=[];pops=[];items=[];
  for(const s of SPAWNS){if(cp&&s[1]<cp)continue;spawnEnt(s[0],s[1],s[2],s[3]);}
  movers=MOVERS.map(([a,b,row],i)=>({x:(a+(i%2?4:0))*TS,y:row*TS+8,w:48,h:8,x1:a*TS,x2:(b+1)*TS-48,vx:(i%2?-0.7:0.7)*(1+game.loop*0.15)}));
  game.time=180;game.timeF=0;game.camLock=false;game.camMin=0;game.bossSpawned=false;
  game.camX=clamp(P.x-W/2,0,LW*TS-W);
  zombieTimer=90;ghostTimer=200;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const spd=()=>1+game.loop*0.18;

function spawnEnt(type,tx,ty,extra){
  const e={id:nextId++,type,t:0,flash:0,hurtT:0,active:false,vx:0,vy:0,dir:-1,onGround:false};
  const size={zombie:[12,22],crow:[12,9],plant:[14,22],pot:[12,12],demon:[16,16],ghost:[14,14],boss:[28,38]}[type];
  e.w=size[0];e.h=size[1];
  e.x=tx*TS+(TS-e.w)/2;e.y=ty*TS-e.h;
  const hp={zombie:1,crow:1,plant:2,pot:1,demon:5+game.loop*2,ghost:1,boss:14+game.loop*6}[type];
  e.hp=hp;
  e.score={zombie:100,crow:100,plant:200,pot:0,demon:1000,ghost:200,boss:5000}[type];
  if(type==='pot')e.content=extra||null;
  if(type==='demon'){e.mode='perch';e.baseY=e.y;}
  if(type==='crow'){e.mode='perch';}
  ents.push(e);return e;
}
function spawnZombie(){
  const zone=ZOMBIE_ZONES.find(z=>P.x>=z[0]*TS&&P.x<=z[1]*TS);
  if(!zone)return;
  if(ents.filter(e=>e.type==='zombie').length>=2+Math.min(2,game.loop))return;
  for(let tries=0;tries<6;tries++){
    const side=Math.random()<0.6?P.dir:-P.dir;
    const x=P.x+side*rnd(48,112);
    if(x<game.camX+8||x>game.camX+W-20)continue;
    if(x<zone[0]*TS||x>zone[1]*TS)continue;
    // find ground surface
    const cx=x+6;let sy=-1;
    for(let ty=3;ty<LH;ty++){const t=map[ty][Math.floor(cx/TS)];if(t===T_GROUND&&(ty===0||map[ty-1][Math.floor(cx/TS)]===T_EMPTY)){sy=ty;break;}if(t!==T_EMPTY)break;}
    if(sy<0)continue;
    if(!solidAt(x+1,sy*TS+2)||!solidAt(x+11,sy*TS+2))continue;
    const z=spawnEnt('zombie',0,0);
    z.x=x;z.y=sy*TS-z.h;z.mode='rise';z.active=true;z.dir=P.x<x?-1:1;z.groundY=sy*TS;
    SFX.rise();
    return;
  }
}

/* ---------- physics ---------- */
function moveBox(e,opts={}){
  let hitWall=false;
  e.x+=e.vx;
  const ys=[e.y+2,e.y+e.h/2,e.y+e.h-2];
  if(e.vx>0){const xe=e.x+e.w;if(ys.some(y=>solidAt(xe,y))){e.x=Math.floor(xe/TS)*TS-e.w-0.01;hitWall=true;}}
  else if(e.vx<0){if(ys.some(y=>solidAt(e.x,y))){e.x=Math.floor(e.x/TS)*TS+TS;hitWall=true;}}
  const prevBottom=e.y+e.h;
  e.y+=e.vy;e.onGround=false;
  if(opts.movers)e.ride=null;
  const xs=[e.x+1,e.x+e.w/2,e.x+e.w-1];
  if(e.vy>=0){
    const b=e.y+e.h,top=Math.floor(b/TS)*TS;
    for(const x of xs){
      const t=tileAt(x,b);
      let land=isSolidT(t);
      if(!land&&!opts.noOneWay&&prevBottom<=top+0.5){
        if(t===T_PLAT)land=true;
        else if(t===T_LADDER&&tileAt(x,b-TS)!==T_LADDER&&!opts.dropLadder)land=true;
      }
      if(land){e.y=top-e.h;e.vy=0;e.onGround=true;break;}
    }
    if(!e.onGround&&opts.movers){
      for(const m of movers){
        if(e.x+e.w>m.x&&e.x<m.x+m.w&&prevBottom<=m.y+0.5&&e.y+e.h>=m.y){e.y=m.y-e.h;e.vy=0;e.onGround=true;e.ride=m;break;}
      }
    }
  }else{
    if(xs.some(x=>solidAt(x,e.y))){e.y=Math.floor(e.y/TS)*TS+TS;e.vy=0;}
  }
  return hitWall;
}

/* ---------- player ---------- */
const G=0.22,JUMP=4.6,WALK=1.5;
const WEAP={lance:{max:2,cd:12},dagger:{max:3,cd:8},torch:{max:2,cd:16},axe:{max:2,cd:16}};
const WEAP_NAME={lance:'槍',dagger:'短剣',torch:'松明',axe:'斧'};
function throwWeapon(){
  const p=P;const wd=WEAP[p.weapon];
  if(shots.filter(s=>s.type!=='fire').length>=wd.max)return;
  p.throwT=wd.cd;
  const sx=p.x+p.w/2+p.dir*4,sy=p.y+(p.crouch?10:7);
  const s={type:p.weapon,x:sx,y:sy,vx:0,vy:0,g:0,dmg:1,pierce:false,t:0,dir:p.dir};
  switch(p.weapon){
    case 'lance':s.w=16;s.h=4;s.vx=p.dir*5;break;
    case 'dagger':s.w=10;s.h=4;s.vx=p.dir*6.5;break;
    case 'torch':s.w=8;s.h=8;s.vx=p.dir*2.6;s.vy=-2.6;s.g=0.2;s.dmg=2;break;
    case 'axe':s.w=12;s.h=12;s.vx=p.dir*3;s.vy=-3.6;s.g=0.18;s.dmg=2;s.pierce=true;break;
  }
  s.x-=s.w/2;s.y-=s.h/2;
  shots.push(s);SFX.throw();
}
function hurtPlayer(){
  const p=P;
  if(p.inv>0||p.state==='dead'||game.state!=='play')return;
  if(p.armor){
    p.armor=false;p.state='hurt';p.vy=-2.6;p.airVx=-p.dir*1.2;p.onGround=false;p.inv=120;p.ride=null;
    for(let i=0;i<10;i++)parts.push({x:p.x+p.w/2,y:p.y+8,vx:rnd(-2,2),vy:rnd(-3.5,-1),g:0.18,life:50,c:i%2?'#c9cfe0':'#8a90a8',s:3});
    SFX.armor();
  }else killPlayer();
}
function killPlayer(){
  const p=P;if(p.state==='dead')return;
  p.state='dead';p.t=0;p.vx=0;p.vy=-2;p.armor=false;
  stopMusic();SFX.die();
}
function updatePlayer(){
  const p=P;p.t++;
  if(p.state==='dead'){
    if(p.t<30){p.vy+=G;p.y+=p.vy;if(p.y>(GROUND_Y+2)*TS)p.vy=0;}
    if(p.t>150)loseLife();
    return;
  }
  if(p.inv>0)p.inv--;
  if(p.throwT>0)p.throwT--;
  const cx=p.x+p.w/2;
  if(p.state==='ladder'){
    if(inp.left)p.dir=-1;else if(inp.right)p.dir=1;
    if(inp.attackP&&p.throwT===0)throwWeapon();
    if(p.throwT>0){}
    else if(inp.up){p.y-=1.1;p.anim++;}
    else if(inp.down){p.y+=1.3;p.anim++;}
    const feet=p.y+p.h;
    if(inp.down&&solidAt(cx,feet)){p.y=Math.floor(feet/TS)*TS-p.h;p.state='normal';p.onGround=true;}
    else if(!isLadder(cx,feet-1)){
      if(isLadder(cx,feet+3)){p.y=Math.floor((feet+3)/TS)*TS-p.h;p.state='normal';p.onGround=true;}
      else if(!isLadder(cx,p.y+2)){p.state='normal';p.airVx=0;}
    }
    return;
  }
  if(p.state==='hurt'){
    p.vx=p.airVx;p.vy=Math.min(p.vy+G,5);
    moveBox(p,{movers:true});
    if(p.onGround){p.state='normal';p.vx=0;}
  }else{
    const ladderBody=isLadder(cx,p.y+p.h-4)||isLadder(cx,p.y+6);
    if(p.onGround){
      const ladderBelow=isLadder(cx,p.y+p.h+2)&&!isLadder(cx,p.y+p.h-2);
      if(inp.down&&ladderBelow){enterLadder(Math.floor(cx/TS));p.y+=4;return;}
      if(inp.up&&ladderBody&&!inp.jump){enterLadder(Math.floor(cx/TS));return;}
      p.crouch=inp.down&&!inp.left&&!inp.right;
      if(p.throwT>0||p.crouch)p.vx=0;
      else if(inp.left){p.vx=-WALK;p.dir=-1;}
      else if(inp.right){p.vx=WALK;p.dir=1;}
      else p.vx=0;
      if(inp.left&&p.crouch)p.dir=-1;else if(inp.right&&p.crouch)p.dir=1;
      if(p.vx)p.anim++;
      if(inp.jumpP){
        // 十字キーの向きでジャンプ方向を決める（攻撃直後やしゃがみ中でも斜めに飛べる）
        const dirIn=inp.left?-1:inp.right?1:0;
        if(dirIn)p.dir=dirIn;
        p.crouch=false;p.vy=-JUMP;p.airVx=dirIn*WALK;p.onGround=false;p.ride=null;p.jumpT=0;SFX.jump();
      }
      p.airVx=p.onGround?p.vx:p.airVx;
    }else{
      p.crouch=false;
      // ジャンプ直後6フレーム以内なら横入力を受け付ける（ボタンと十字キーの同時押しのズレを吸収）
      if(p.jumpT<6&&p.airVx===0&&(inp.left||inp.right)){p.dir=inp.left?-1:1;p.airVx=p.dir*WALK;}
      p.jumpT++;
      if(inp.up&&ladderBody&&p.vy>-1){enterLadder(Math.floor(cx/TS));return;}
      p.vx=p.airVx;
    }
    if(inp.attackP&&p.throwT===0)throwWeapon();
    const wasGround=p.onGround;
    if(p.ride&&p.onGround){p.x+=p.ride.vx;}
    p.vy=Math.min(p.vy+G,5);
    moveBox(p,{movers:true});
    if(!p.onGround)p.ride=null;
    if(wasGround&&!p.onGround&&p.vy>=0&&p.vy<1){p.airVx=0;}
  }
  // crouch height adjust (keep feet)
  if(p.crouch&&p.h!==14){p.y+=8;p.h=14;}
  if(!p.crouch&&p.h!==22){if(!solidAt(p.x+1,p.y-8)&&!solidAt(p.x+p.w-1,p.y-8)){p.y-=8;p.h=22;}else{p.crouch=true;}}
  // bounds
  if(p.x<game.camMin){p.x=game.camMin;}
  if(p.x>LW*TS-p.w-TS)p.x=LW*TS-p.w-TS;
  // water / pit
  const feetT=tileAt(p.x+p.w/2,p.y+p.h-2);
  if(feetT===T_WATER||p.y>LH*TS){
    for(let i=0;i<8;i++)parts.push({x:p.x+p.w/2,y:GROUND_Y*TS,vx:rnd(-1.5,1.5),vy:rnd(-3,-1),g:0.15,life:40,c:'#7fb6ff',s:2});
    killPlayer();
  }
  // checkpoint
  if(p.x>CHECKPOINT*TS&&game.checkpoint<CHECKPOINT)game.checkpoint=CHECKPOINT;
}
function enterLadder(tx){const p=P;p.state='ladder';p.x=tx*TS+TS/2-p.w/2;p.vx=0;p.vy=0;p.crouch=false;if(p.h!==22){p.y-=8;p.h=22;}p.ride=null;}

function loseLife(){
  game.lives--;
  if(game.lives<0){game.state='over';game.t=0;if(game.score>=hiscore){hiscore=game.score;saveHi();}return;}
  resetStage(true);
  game.state='intro';game.t=0;
}

/* ---------- enemies ---------- */
function addScore(n,x,y){
  if(!n)return;
  game.score+=n;if(game.score>hiscore){hiscore=game.score;}
  pops.push({x,y,text:String(n),life:50});
}
function killEnt(e){
  e.dead=true;
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  addScore(e.score,cx,e.y);
  if(e.type==='pot'){
    SFX.pot();
    for(let i=0;i<6;i++)parts.push({x:cx,y:cy,vx:rnd(-2,2),vy:rnd(-3,-1),g:0.2,life:30,c:'#9b5a2e',s:3});
    dropItem(cx,cy,e.content||randomContent());
    return;
  }
  if(e.type==='boss'){
    game.shake=40;SFX.boom();
    for(let i=0;i<60;i++)parts.push({x:cx+rnd(-14,14),y:cy+rnd(-18,18),vx:rnd(-2.5,2.5),vy:rnd(-3.5,1),g:0.08,life:rnd(40,90),c:['#ff6a2b','#ffd24a','#c8312b','#fff'][i%4],s:rnd(2,4)|0});
    setTimeout(()=>{if(game.state==='play')dropItem(cx,e.y,'key');},700);
    stopMusic();
    return;
  }
  SFX.kill();
  for(let i=0;i<10;i++)parts.push({x:cx,y:cy,vx:rnd(-2,2),vy:rnd(-2.5,0.5),g:0.1,life:28,c:i%2?'#ffd24a':'#ff6a2b',s:2});
  if(Math.random()<(e.type==='demon'?1:0.12))dropItem(cx,cy,e.type==='demon'?'armor':randomContent());
}
function randomContent(){
  const r=Math.random();
  const weapons=['lance','dagger','torch','axe'].filter(w=>w!==P.weapon);
  if(r<0.45)return weapons[Math.floor(Math.random()*weapons.length)];
  if(r<0.75)return 'pasta';
  if(r<0.93)return 'pizza';
  return 'armor';
}
function dropItem(x,y,kind){items.push({kind,x:x-6,y:y-12,w:12,h:12,vx:0,vy:-2.5,onGround:false,life:kind==='key'?99999:600});}
function damageEnt(e,s){
  if(e.dead||e.hurtT>0)return false;
  if(e.type==='zombie'&&e.mode==='rise'&&e.t<14)return false;
  e.hp-=s.dmg;e.flash=6;
  if(s.pierce||s.type==='fire')e.hurtT=14;
  if(e.hp<=0)killEnt(e);else SFX.hit();
  return true;
}
function enemyShot(x,y,speed,tx,ty,kind){
  const dx=tx-x,dy=ty-y,l=Math.hypot(dx,dy)||1;
  ebullets.push({x:x-3,y:y-3,w:6,h:6,vx:dx/l*speed,vy:dy/l*speed,kind:kind||'orb',t:0});
}
function updateEnts(){
  const pc={x:P.x+P.w/2,y:P.y+P.h/2};
  for(const e of ents){
    if(e.dead)continue;
    if(e.flash>0)e.flash--;
    if(e.hurtT>0)e.hurtT--;
    if(!e.active){
      if(e.x<game.camX+W+8&&e.x+e.w>game.camX-8)e.active=true;else continue;
    }
    e.t++;
    const ec={x:e.x+e.w/2,y:e.y+e.h/2};
    const dx=pc.x-ec.x,dy=pc.y-ec.y;
    switch(e.type){
      case 'zombie':{
        if(e.mode==='rise'){if(e.t>=40){e.mode='walk';}break;}
        e.vx=e.dir*0.55*spd();e.vy=Math.min(e.vy+G,5);
        const hw=moveBox(e);
        if(hw)e.dir*=-1;
        if(tileAt(e.x+e.w/2,e.y+e.h-1)===T_WATER||e.y>LH*TS){e.dead=true;}
        if(e.t>1200)e.dead=true;
        break;}
      case 'crow':{
        if(e.mode==='perch'){
          e.dir=dx<0?-1:1;
          if(Math.abs(dx)<110&&e.t>20){e.mode='fly';e.t=0;e.vx=e.dir*1.35*spd();e.baseY=e.y-6;SFX.caw();}
        }else{
          e.x+=e.vx;e.baseY+=Math.sign(pc.y-6-e.baseY)*0.35;
          e.y=e.baseY+Math.sin(e.t*0.15)*7;
        }
        break;}
      case 'plant':{
        e.dir=dx<0?-1:1;
        if(e.t%Math.round(110/spd())===60&&Math.abs(dx)<200){enemyShot(ec.x+e.dir*4,e.y+6,1.4*spd(),pc.x,pc.y,'eye');SFX.shoot();}
        break;}
      case 'pot':{e.vy=Math.min(e.vy+G,5);e.vx=0;moveBox(e);break;}
      case 'ghost':{
        e.x+=e.vx;e.y=e.baseY+Math.sin(e.t*0.05)*22;
        if(e.t>900)e.dead=true;
        break;}
      case 'demon':updateDemon(e,pc,ec,dx,dy);break;
      case 'boss':updateBoss(e,pc,ec,dx,dy);break;
    }
    // despawn if far behind / ahead
    if(e.type!=='boss'&&e.type!=='pot'&&(e.x<game.camX-64||e.x>game.camX+W+120)&&e.mode!=='perch')e.dead=true;
    // contact
    if(!e.dead&&e.type!=='pot'&&!(e.type==='zombie'&&e.mode==='rise'&&e.t<24)){
      const hb={x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-4};
      const pb={x:P.x+1,y:P.y+2,w:P.w-2,h:P.h-3};
      if(overlap(hb,pb))hurtPlayer();
    }
  }
  ents=ents.filter(e=>!e.dead);
}
function updateDemon(e,pc,ec,dx,dy){
  e.dir=dx<0?-1:1;
  const s=spd();
  if(e.mode==='perch'){
    if(Math.abs(dx)<150){e.mode='hover';e.t=0;e.vx=0;e.vy=-1;SFX.caw();}
    return;
  }
  if(e.mode==='hover'){
    const tx=pc.x-e.dir*72,ty=P.y-28;
    e.vx+=clamp((tx-ec.x)*0.01,-0.12,0.12);e.vy+=clamp((ty-ec.y)*0.01,-0.12,0.12);
    e.vx*=0.95;e.vy*=0.95;
    // dodge incoming shots
    for(const sh of shots){
      if(sh.type==='fire')continue;
      const sx=sh.x+sh.w/2;
      if(Math.abs(sx-ec.x)<52&&Math.sign(sh.vx)===Math.sign(ec.x-sx)&&Math.abs(sh.y-ec.y)<18&&Math.random()<0.08){e.vy=-3.2;}
    }
    if(e.t%80===40&&Math.random()<0.6){enemyShot(ec.x,ec.y,1.6*s,pc.x,pc.y,'fire');SFX.shoot();}
    if(e.t>110+Math.random()*60){e.mode='swoop';e.t=0;const l=Math.hypot(dx,dy)||1;e.vx=dx/l*2.7*s;e.vy=dy/l*2.7*s;}
  }else if(e.mode==='swoop'){
    if(e.t>55||e.y>GROUND_Y*TS-e.h-2){e.mode='rise';e.t=0;}
  }else if(e.mode==='rise'){
    e.vy=-1.6;e.vx*=0.97;
    if(e.t>30){e.mode='hover';e.t=0;}
  }
  e.x+=e.vx;e.y+=e.vy;
  e.y=clamp(e.y,20,GROUND_Y*TS-e.h);
  e.x=clamp(e.x,game.camX-20,game.camX+W+4);
}
function updateBoss(e,pc,ec,dx,dy){
  const s=spd();
  e.vy=Math.min(e.vy+0.25,6);
  const wasGround=e.onGround;
  if(e.onGround){
    e.dir=dx<0?-1:1;
    e.vx=e.dir*0.45*s;
    if(e.t%Math.round(120/s)===0&&e.t>0){e.vy=-5.4;e.vx=e.dir*1.7;}
    if(e.t%Math.round(90/s)===50){
      for(let a=-1;a<=1;a++)enemyShot(ec.x+e.dir*10,e.y+10,1.7*s,pc.x+a*30,pc.y+a*10,'fire');
      SFX.shoot();
    }
  }
  moveBox(e,{noOneWay:true});
  if(e.onGround&&!wasGround&&e.t>10){game.shake=12;noise(0.2,0.15);e.vx=0;}
  e.x=clamp(e.x,game.camMin+4,LW*TS-TS-e.w);
}

/* ---------- main update ---------- */
function updatePlay(){
  // timer
  if(++game.timeF>=60){game.timeF=0;game.time--;if(game.time<=0){game.time=0;killPlayer();}}
  for(const m of movers){m.x+=m.vx;if(m.x<m.x1){m.x=m.x1;m.vx*=-1;}if(m.x>m.x2){m.x=m.x2;m.vx*=-1;}}
  updatePlayer();
  // camera
  if(!game.camLock){
    game.camX=clamp(P.x+P.w/2-W/2+P.dir*12,game.camMin,LW*TS-W);
    if(P.x>LW*TS-W+40){game.camLock=true;game.camMin=LW*TS-W;game.camX=game.camMin;}
  }else game.camX=game.camMin;
  if(game.camLock&&!game.bossSpawned){
    game.bossSpawned=true;
    const b=spawnEnt('boss',0,0);b.x=LW*TS-TS-60;b.y=-40;b.active=true;b.t=1;
    stopMusic();setTimeout(()=>{if(game.state==='play')startMusic('boss');},600);
    game.shake=20;
  }
  // spawners
  if(P.state!=='dead'&&!game.camLock){
    if(--zombieTimer<=0){spawnZombie();zombieTimer=Math.round(rnd(70,150)/spd());}
    if(P.x>GHOST_ZONE[0]*TS&&P.x<GHOST_ZONE[1]*TS&&--ghostTimer<=0){
      const g=spawnEnt('ghost',0,0);g.x=game.camX+W+4;g.baseY=rnd(60,150);g.y=g.baseY;g.vx=-0.8*spd();g.active=true;
      ghostTimer=Math.round(rnd(220,360)/spd());
    }
  }
  updateEnts();
  // shots
  for(const s of shots){
    s.t++;
    if(s.type==='fire'){if(s.t>50)s.dead=true;}
    else{
      s.vy+=s.g;s.x+=s.vx;s.y+=s.vy;
      const cx=s.x+s.w/2,cy=s.y+s.h/2;
      if(solidAt(cx,cy)){
        if(s.type==='torch'){s.dead=true;shots.push({type:'fire',x:cx-7,y:Math.floor(cy/TS)*TS-12,w:14,h:12,dmg:1,t:0,pierce:true});}
        else if(s.type==='axe'&&s.vy>0)s.dead=true;
        else if(s.type!=='axe'){s.dead=true;parts.push({x:cx,y:cy,vx:0,vy:0,g:0,life:6,c:'#fff',s:3});}
      }
      if(s.x<game.camX-24||s.x>game.camX+W+24||s.y>H+20)s.dead=true;
    }
    if(s.dead)continue;
    for(const e of ents){
      if(e.dead||!e.active)continue;
      if(overlap(s,e)&&damageEnt(e,s)){if(!s.pierce){s.dead=true;break;}}
    }
  }
  shots=shots.filter(s=>!s.dead);
  // enemy bullets
  for(const b of ebullets){
    b.t++;b.x+=b.vx;b.y+=b.vy;
    if(b.x<game.camX-16||b.x>game.camX+W+16||b.y<-16||b.y>H+16||b.t>400)b.dead=true;
    else if(overlap({x:b.x+1,y:b.y+1,w:b.w-2,h:b.h-2},{x:P.x+1,y:P.y+2,w:P.w-2,h:P.h-3})&&P.inv===0&&P.state!=='dead'){b.dead=true;hurtPlayer();}
  }
  ebullets=ebullets.filter(b=>!b.dead);
  // items
  for(const it of items){
    it.life--;if(it.life<=0)it.dead=true;
    if(!it.onGround){it.vy=Math.min(it.vy+0.18,4);moveBox(it,{movers:true});if(it.ride)it.ride=null;}
    if(tileAt(it.x+6,it.y+11)===T_WATER||it.y>LH*TS)it.dead=true;
    if(!it.dead&&P.state!=='dead'&&overlap(it,P)){it.dead=true;pickItem(it);}
  }
  items=items.filter(i=>!i.dead);
  // particles
  for(const q of parts){q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.life--;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=0.4;q.life--;}
  pops=pops.filter(q=>q.life>0);
  if(game.shake>0)game.shake--;
  if(lightning>0)lightning--;else if(Math.random()<0.0015){lightning=8;noise(0.6,0.08);}
}
function pickItem(it){
  const cx=it.x+6,cy=it.y;
  switch(it.kind){
    case 'armor':if(P.armor)addScore(500,cx,cy);else{P.armor=true;pops.push({x:cx,y:cy,text:'ARMOR',life:60});}break;
    case 'pasta':addScore(200,cx,cy);pops.push({x:cx,y:cy-8,text:'パスタ',life:50});break;
    case 'pizza':addScore(500,cx,cy);pops.push({x:cx,y:cy-8,text:'ピザ',life:50});break;
    case 'key':game.state='clear';game.t=0;game.bonus=game.time*10;SFX.clear();return;
    default:P.weapon=it.kind;pops.push({x:cx,y:cy,text:WEAP_NAME[it.kind],life:60});
  }

}

function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177;return (h^(h>>16))>>>0;}

    const t=map[ty][tx];if(!t)continue;

    switch(t){
      case T_GROUND:{
        R('#4a2f22',x,y,TS,TS);

        R('#3a2219',x+(h%12),y+4+((h>>4)%8),3,2);R('#5e3c2a',x+((h>>8)%13),y+((h>>12)%12),2,2);R('#3a2219',x+((h>>16)%10)+3,y+10,2,1);

      case T_STONE:{

        R('#2c2a3a',x+7,y+4,2,8);R('#2c2a3a',x+5,y+6,6,2);
        R('#2f6b3a',x+1,y+14,3,2);R('#2f6b3a',x+12,y+15,3,1);

      case T_PLAT:{

      case T_LADDER:{
        R('#8a6338',x+2,y,2,TS);R('#8a6338',x+12,y,2,TS);R('#5a3e22',x+3,y,1,TS);R('#5a3e22',x+13,y,1,TS);
        for(let i=2;i<TS;i+=5)R('#a87c48',x+2,y+i,12,2);

      case T_WATER:{

  const fr=e.onGround?(e.t>>4)%2:0;

  S(cd,-11,-12,8,12-(fr?1:0));S(cd,3,-12,8,12-(fr?0:1));S('#2a1c10',-12,-2,10,2);S('#2a1c10',3,-2,10,2);
  // body
  S(c,-13,-30,26,19);S(cd,6,-28,6,16);S('#5a3e22',-13,-14,26,3);S('#e3b04b',-2,-14,4,3);
  S(sk,-6,-28,10,10);S('#b8946a',-3,-24,4,1);
  // head
  S(c,-9,-38,18,10);S(cd,-9,-30,18,2);
  circ('#f2ead8',sx+(e.dir>0?2:-2),sy-34,4);
  circ('#c8312b',sx+(e.dir>0?3.5:-3.5),sy-34,2);
  S('#e8e0c8',-1,-43,3,5);S('#e8e0c8',0,-45,1,2);
  S('#f2ead8',2,-29,2,2);S('#f2ead8',6,-29,2,2);
  // arms + club
  S(c,-16,-28,4,12);S(c,12,-28,4,10);
  S('#6b4a2a',14,-36,4,14);S('#8a6338',12,-42,8,8);S('#3e2a18',13,-40,2,2);S('#3e2a18',17,-38,2,2);
  // hp bar
  const max=14+game.loop*6;
  R('#000',W/2-41,H-12,82,6);R('#3a1416',W/2-40,H-11,80,4);R('#c8312b',W/2-40,H-11,Math.max(0,80*e.hp/max),4);
}
function drawPot(e,sx,sy){
  at(sx,sy,1);
  const c=e.flash?'#fff':'#9b5a2e';
  S(c,-5,-9,10,9);S(c,-4,-11,8,2);S('#c27a44',-4,-8,2,6);S('#5e3218',3,-8,2,8);S('#5e3218',-3,-12,6,1);S('#e3b04b',-5,-6,10,1);
}
function drawShot(s){
  const x=Math.round(s.x-game.camX),y=Math.round(s.y);
  const f=s.dir||1;
  switch(s.type){
    case 'lance':
      R('#8a6338',x+(f>0?0:4),y+1,12,2);R('#eef0ff',x+(f>0?12:0),y,4,4);R('#b9bfd2',x+(f>0?11:4),y+1,1,2);break;
    case 'dagger':
      R('#eef0ff',x+(f>0?3:0),y+1,7,2);R('#e3b04b',x+(f>0?0:7),y,3,4);break;
    case 'torch':{
      const fl=(s.t>>2)%2;R('#6b4a2a',x+3,y+3,2,5);R('#ff6a2b',x+1,y,6,4);R('#ffd24a',x+2+fl,y+1,3,2);break;}
    case 'axe':{
      const a=(s.t>>2)%4;ctx.save();ctx.translate(x+6,y+6);ctx.rotate(a*Math.PI/2*(f));
      R('#6b4a2a',-1,-6,2,12);R('#b9bfd2',1,-6,5,6);R('#eef0ff',4,-5,2,4);ctx.restore();break;}
    case 'fire':{
      const fl=(s.t>>2)%3;
      R('#c8312b',x,y+4,14,8);R('#ff6a2b',x+1+fl,y+1,5,10);R('#ff6a2b',x+8-fl,y+2,4,9);R('#ffd24a',x+4,y+5+fl%2,5,6);break;}
  }
}
function drawBullet(b){
  const x=Math.round(b.x-game.camX),y=Math.round(b.y);
  if(b.kind==='eye'){circ('#f2ead8',x+3,y+3,3);circ('#c8312b',x+3+Math.sign(b.vx),y+3,1.4);}
  else{const fl=(b.t>>2)%2;circ('#ff6a2b',x+3,y+3,3+fl*0.5);circ('#ffd24a',x+3,y+3,1.5);}
}
function drawItemIcon(kind,x,y){
  switch(kind){
    case 'lance':R('#8a6338',x,y+5,9,2);R('#eef0ff',x+9,y+4,3,4);break;
    case 'dagger':R('#eef0ff',x+3,y+5,8,2);R('#e3b04b',x,y+4,3,4);break;
    case 'torch':R('#6b4a2a',x+5,y+5,2,7);R('#ff6a2b',x+3,y+1,6,5);R('#ffd24a',x+4,y+2,3,3);break;
    case 'axe':R('#6b4a2a',x+5,y,2,12);R('#b9bfd2',x+7,y,5,6);R('#eef0ff',x+10,y+1,2,4);break;
    case 'armor':R('#b9bfd2',x+1,y+2,10,9);R('#eef0ff',x+2,y+3,3,6);R('#6f7590',x+8,y+3,2,7);R('#b9bfd2',x,y+1,3,3);R('#b9bfd2',x+9,y+1,3,3);R('#e3b04b',x+5,y+9,2,1);break;
    case 'pizza':
      ctx.fillStyle='#e8b85a';ctx.beginPath();ctx.moveTo(x,y+1);ctx.lineTo(x+12,y+1);ctx.lineTo(x+6,y+12);ctx.fill();
      R('#c27a44',x,y,12,2);R('#d03a3a',x+3,y+3,2,2);R('#d03a3a',x+7,y+4,2,2);R('#d03a3a',x+5,y+7,2,2);R('#3f8a3c',x+6,y+3,1,1);break;
    case 'pasta':
      R('#f2ead8',x,y+6,12,5);R('#cfc6b0',x+1,y+10,10,2);R('#e8c45a',x+2,y+3,8,4);R('#d8a840',x+3,y+4,2,1);R('#d8a840',x+7,y+5,2,1);R('#d03a3a',x+4,y+2,4,2);R('#3f8a3c',x+6,y+1,2,1);break;
    case 'key':
      R('#e3b04b',x,y+3,6,6);R('#000',x+2,y+5,2,2);R('#e3b04b',x+6,y+5,6,2);R('#e3b04b',x+9,y+7,2,3);R('#ffe9a0',x+1,y+3,2,1);break;
  }
}

/* ---------- HUD ---------- */
function drawHUD(){
  R('rgba(0,0,0,0.55)',0,0,W,20);
  text('1P',6,3,'#c8312b');text(String(game.score).padStart(6,'0'),6,11);
  text('TOP',96,3,'#c8312b');text(String(hiscore).padStart(6,'0'),88,11);
  const m=Math.floor(game.time/60),s=String(game.time%60).padStart(2,'0');
  text('TIME',178,3,game.time<30&&(game.t>>4)%2?'#ffd24a':'#c8312b');text(`${m}:${s}`,186,11);
  // weapon box
  R('#000',226,2,22,16);R('#3a3048',227,3,20,14);drawItemIcon(P.weapon,231,5);
  // lives
  for(let i=0;i<Math.min(game.lives,5);i++){const x=6+i*10;R('#b9bfd2',x,H-12,7,7);R('#1a1622',x+3,H-10,4,2);R('#c8312b',x-1,H-14,4,2);}
}

/* ---------- screens ---------- */
function drawTitle(){
  game.camX=(game.t*0.4)%((LW-20)*TS);
  drawBG();
  R('rgba(8,6,16,0.55)',0,0,W,H);
  ctx.save();
  const bob=Math.sin(game.t*0.05)*2;
  ctx.font=JP(36);ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='#2a0808';ctx.fillText('魔界騎士',W/2+2,40+bob+2);
  ctx.fillStyle='#c8312b';ctx.fillText('魔界騎士',W/2,40+bob);
  ctx.restore();
  text('MAKAI KNIGHT',W/2,84,'#e3b04b','center');
  // knight + zombie vignette
  const kp={dir:1,armor:true,state:'normal',onGround:true,vx:1,anim:game.t,throwT:0,weapon:'lance',crouch:false,inv:0};
  drawKnight(kp,W/2-28,142);
  drawZombie({dir:-1,mode:'walk',t:game.t,flash:0},W/2+30,142);
  R('#2f6b3a',W/2-60,142,120,2);
  if((game.t>>5)%2===0)text(isTouch?'TAP TO START':'PRESS ENTER',W/2,160,'#fff','center');
  ctx.font=JP(12);ctx.textAlign='center';ctx.fillStyle='#8d839c';
  ctx.fillText('姫をさらった魔王の城へ　墓場と魔の森を越えよ',W/2,180);
  text('TOP '+String(hiscore).padStart(6,'0'),W/2,198,'#e3b04b','center');
  ctx.font=JP(10);ctx.fillStyle='#6d6480';ctx.textAlign='center';
  ctx.fillText('PASTA & PIZZA base PRESENTS',W/2,212);
}
function drawIntro(){
  R('#000',0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='top';
  text(`STAGE 1${game.loop?'  LOOP '+(game.loop+1):''}`,W/2,52,'#e3b04b','center');
  ctx.font=JP(16);ctx.fillStyle='#ece4d0';ctx.fillText('墓場 〜 魔の森 〜 魔王の門',W/2,72);
  // little map
  R('#2a2236',40,112,176,2);
  const marks=[[40,'墓'],[100,'沼'],[150,'森'],[210,'門']];
  ctx.font=JP(12);
  for(const [x,l] of marks){R('#c8312b',x-2,109,4,8);ctx.fillStyle='#8d839c';ctx.fillText(l,x,120);}
  const px=40+(game.checkpoint?(CHECKPOINT/LW)*176:0);
  if((game.t>>3)%2)R('#e3b04b',px-3,102,6,6);
  text(`LIVES x ${Math.max(0,game.lives)}`,W/2,150,'#fff','center');
  if(game.loop>0){ctx.font=JP(12);ctx.fillStyle='#c8312b';ctx.fillText('魔物たちが強くなっている……',W/2,172);}
}
function drawWorld(){
  const shx=game.shake?Math.round(rnd(-2,2)):0,shy=game.shake?Math.round(rnd(-2,2)):0;
  ctx.save();ctx.translate(shx,shy);
  drawBG();
  drawTiles();
  const cam=game.camX;
  for(const it of items){
    if(it.life<120&&(it.life>>2)%2)continue;
    const bob=it.kind==='key'?Math.sin(game.t*0.1)*2:0;
    drawItemIcon(it.kind,Math.round(it.x-cam),Math.round(it.y+bob));
  }
  for(const e of ents){
    if(!e.active&&e.type!=='crow'&&e.type!=='pot'&&e.type!=='plant'&&e.type!=='demon')continue;
    const sx=Math.round(e.x+e.w/2-cam),sy=Math.round(e.y+e.h);
    if(sx<-40||sx>W+40)continue;
    switch(e.type){
      case 'zombie':drawZombie(e,sx,sy);break;
      case 'crow':drawCrow(e,sx,sy);break;
      case 'plant':drawPlant(e,sx,sy);break;
      case 'ghost':drawGhost(e,sx,sy);break;
      case 'demon':drawDemon(e,sx,sy);break;
      case 'boss':drawBoss(e,sx,sy);break;
      case 'pot':drawPot(e,sx,sy);break;
    }
  }
  drawKnight(P,Math.round(P.x+P.w/2-cam),Math.round(P.y+P.h));
  for(const s of shots)drawShot(s);
  for(const b of ebullets)drawBullet(b);
  for(const q of parts)R(q.c,q.x-cam,q.y,q.s,q.s);
  for(const q of pops){
    if(/^[0-9A-Z]+$/.test(q.text))text(q.text,Math.round(q.x-cam),Math.round(q.y),'#ffd24a','center');
    else{ctx.font=JP(12);ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(q.text,Math.round(q.x-cam)+1,Math.round(q.y)+1);ctx.fillStyle='#ffd24a';ctx.fillText(q.text,Math.round(q.x-cam),Math.round(q.y));}
  }
  ctx.restore();
  if(lightning>0&&lightning%3)R('rgba(220,220,255,0.25)',0,0,W,H);
  drawHUD();
}

function togglePause(){
  if(game.state==='play'){game.state='pause';SFX.pause();}
  else if(game.state==='pause'){game.state='play';SFX.pause();}
}

/* ---------- loop ---------- */
function step(){
  readInput();
  game.t++;
  switch(game.state){
    case 'title':
      if(inp.startP||inp.jumpP||inp.attackP){initAudio();SFX.start();game.score=0;game.lives=3;game.loop=0;game.checkpoint=0;P=null;resetStage(false);game.state='intro';game.t=0;}
      break;
    case 'intro':
      if(game.t>150||(game.t>30&&(inp.startP||inp.jumpP))){game.state='play';game.t=0;startMusic('stage');}
      break;
    case 'play':
      if(inp.startP){togglePause();break;}
      updatePlay();
      break;
    case 'pause':
      if(inp.startP)togglePause();
      break;
    case 'clear':
      if(game.bonus>0){const d=Math.min(game.bonus,50);game.bonus-=d;addScore(0);game.score+=d;if(game.score>hiscore)hiscore=game.score;if(game.t%4===0)tone(1200,0.03,'square',0.04);}
      if(game.t>300){saveHi();game.loop++;game.checkpoint=0;resetStage(false);game.state='intro';game.t=0;}
      for(const q of parts){q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.life--;}parts=parts.filter(q=>q.life>0);
      break;
    case 'over':
      if(game.t>90&&(inp.startP||inp.jumpP||inp.attackP)){game.state='title';game.t=0;}
      break;
  }
  musicTick();
}
function render(){
  switch(game.state){
    case 'title':drawTitle();break;
    case 'intro':drawIntro();break;
    case 'play':drawWorld();break;
    case 'pause':drawWorld();R('rgba(0,0,0,0.5)',0,0,W,H);text('PAUSE',W/2,100,'#fff','center');ctx.font=JP(12);ctx.textAlign='center';ctx.fillStyle='#8d839c';ctx.fillText(`武器：${WEAP_NAME[P.weapon]}`,W/2,118);break;
    case 'clear':
      drawWorld();R('rgba(0,0,0,0.6)',0,40,W,110);
      ctx.font=JP(20);ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#e3b04b';ctx.fillText('魔王の門を突破！',W/2,56);
      text('STAGE CLEAR',W/2,86,'#fff','center');
      text(`TIME BONUS ${String(game.bonus).padStart(5,' ')}`,W/2,104,'#ffd24a','center');
      ctx.font=JP(12);ctx.fillStyle='#8d839c';ctx.fillText('だが、それは魔王の罠だった……',W/2,124);
      break;
    case 'over':
      R('#000',0,0,W,H);
      ctx.font=JP(28);ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#c8312b';ctx.fillText('GAME OVER',W/2,76);
      text(`SCORE ${String(game.score).padStart(6,'0')}`,W/2,120,'#fff','center');
      text(`TOP   ${String(hiscore).padStart(6,'0')}`,W/2,134,'#e3b04b','center');
      if(game.t>90&&(game.t>>5)%2===0)text(isTouch?'TAP':'PRESS ENTER',W/2,170,'#fff','center');
      break;
  }
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();acc-=1000/60;}
  render();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.state==='play')togglePause();});
buildLevel();P=newPlayer(4);ents=[];shots=[];ebullets=[];parts=[];pops=[];items=[];movers=[];
layout();
const go=()=>{layout();requestAnimationFrame(t=>{last=t;frame(t);});};
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('16px DotGothic16')]),new Promise(r=>setTimeout(r,1500))]).then(go,go);}else go();
})();
</script>
</body></html>
